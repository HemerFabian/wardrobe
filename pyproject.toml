[project]
name = "wardrobe-generator"
version = "0.1.0"
description = "Local AI pipeline for the Wardrobe Android app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
wardrobe = "wardrobe_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
ml = [
    "accelerate>=1.12.0",
    "segment-anything>=1.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/wardrobe_gen"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B023"]
